name: tests

on: [push, pull_request]

jobs:
  build:
    environment: env-satellite
    env:
      CDSAPI_KEY: "{{ secrets.API_UUID }}:{{ secrets.API_KEY }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: false
    
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v3
      with:
        node-version: 24
   
    - name: Semantic Release PR Title Check
      uses: osl-incubator/semantic-release-pr-title-check@v1.4.2
      with:
        convention-name: conventionalcommits 

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        mamba-version: "*"
        environment-file: conda/dev.yaml
        channels: conda-forge,nodefaults
        activate-environment: satellite
        use-mamba: true
        miniforge-variant: Miniforge3
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        poetry install

    - name: Lint
      run: |
        pre-commit run --all-files

    - name: Run tests
      run: |
        pytest -s --cov tests/
