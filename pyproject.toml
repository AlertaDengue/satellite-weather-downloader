
[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "satellite-weather-downloader"
version = "2.0.4"  # changed by semantic-release
description = "The modules available in this package are designed to capture and proccess satellite data from Copernicus"
readme = "README.md"
authors = ["Luã Bida Vacaro <luabidaa@gmail.com>"]
maintainers = ["Luã Bida Vacaro <luabidaa@gmail.com>"]
license = "GNU GPL v3.0"
repository = "https://github.com/osl-incubator/satellite-weather-downloader"
homepage = "https://github.com/osl-incubator/satellite-weather-downloader"

# Pypi classifiers: https://pypi.org/classifiers/
classifiers = [  #! Update me
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

packages = [
  {include='satellite'},
]

[tool.poetry.dependencies]
python = ">=3.11,<4"
cdsapi = ">=0.7.3"
pandas = ">=3,<4"
numpy = ">=2.3.3,<3"
python-dotenv = "^0.21.0"
netCDF4 = "^1.6.1"
loguru = "^0.6.0"
requests = "^2.28.2"
geopandas = ">=1.0.1"
shapely = ">=2.0.3"
epiweeks = "^2.3.0"
pydantic = "^2.9.2"
duckdb = "^1.1.2"
h5netcdf = "^1.4.0"
xagg = "^0.3.2.4"
xarray = "<2024.10"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
jupyterlab = "^3.4.8"
pre-commit = "^2.20.0"
black = "24.2.0"
ruff = "^0.0.284"

[tool.isort]
profile = "black"
src_paths = ["isort", "test"]

[tool.blue]
# https://github.com/psf/black
target-version = ["py39"]
line-length = 79
color = true

exclude = ["*.git", "docs/"]
